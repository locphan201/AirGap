[package]
name = "airgap-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
notify = "8.0"
trash = "5.2"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
fuzzy-matcher = "0.3"
rayon = "1.10"
directories = "6.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.16"

[dev-dependencies]
tempfile = "3.16"
