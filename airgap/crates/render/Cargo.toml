[package]
name = "airgap-render"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
resvg = "0.45"
usvg = "0.45"
tiny-skia = "0.11"
fontdb = "0.23"
syntect = { version = "5", default-features = false, features = ["fancy-regex", "regex-fancy", "default-syntaxes", "default-themes"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html", "simd"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
tempfile = "3.16"
